<!DOCTYPE html>
<html>

<head>

    <link rel="canonical" href="https://www.mirloapps.es/grupeta/callback.html">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Grupeta">
    <meta name="twitter:description" content="Grupeta">
<meta charset="utf-8">
    <title>Grupeta</title>
    <script>
        // Get the code from URL and redirect to app
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        if (code) {
            window.location.href = 'grupeta://oauth?code=' + code;
        }
    </script>
</head>

<body>
    <p>Redirecting to Grupeta...</p>
    <script src="/cookies.js" defer></script>
    <div class="text-center text-sm text-gray-500 py-4"><a href="#" onclick="window.mirloCookiePrefs(); return false;" class="hover:underline">Cookies</a></div>
</body>

</html>
