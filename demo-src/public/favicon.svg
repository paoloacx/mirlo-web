<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <style>
      .bg {
        fill: #0c0d0e;
        stroke: #2a2b2e;
        stroke-width: 2;
      }
      @media (prefers-color-scheme: dark) {
        .bg {
          fill: #121316;
          stroke: #ffffff;
          stroke-width: 4;
        }
      }
      .m-path { fill: #ffffff; }
      .dot { fill: #FF9E00; }
    </style>
  </defs>
  <!-- Card with rounded squircle corners -->
  <rect class="bg" x="6" y="6" width="88" height="88" rx="24" />
  <!-- Pure vector M -->
  <path class="m-path" d="M 22 72 L 22 28 L 32.5 28 L 45 52 L 57.5 28 L 68 28 L 68 72 L 58.5 72 L 58.5 44 L 47.5 64 L 42.5 64 L 31.5 44 L 31.5 72 Z" />
  <!-- Mirlo orange dot -->
  <circle class="dot" cx="77" cy="66" r="6" />
</svg>